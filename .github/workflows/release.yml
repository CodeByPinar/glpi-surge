# Release: push a tag "vX.Y.Z" → GitHub Release with the plugin archives + GLPI images with Surge preinstalled on GHCR.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  archives:
    name: Plugin archives and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version
        id: v
        run: |
          VERSION=$(grep -oP "PLUGIN_SURGE_VERSION',\s*'\K[^']+" setup.php)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match setup.php version $VERSION"; exit 1
          fi

      - name: Build archives
        run: python tools/package.py

      - name: Release notes
        run: |
          python - <<'PY'
          import re
          v = "${{ steps.v.outputs.version }}"
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", log, re.S | re.M)
          body = (m.group(1).strip() if m else "") + f"""

          ### Install
          Extract `surge-{v}.tgz` into `glpi/plugins/`, then *Setup → Plugins → Surge → Install / Enable*
          (console: `glpi:plugin:install surge` on GLPI 11, `plugin:install surge` on GLPI 12).

          ### Try it with Docker
          ```bash
          docker pull ghcr.io/codebypinar/glpi-surge:{v}-glpi11   # or {v}-glpi12
          ```
          See the README for a ready-to-run `docker compose` setup.
          """
          open("release-notes.md", "w", encoding="utf-8").write(re.sub(r"^ {10}", "", body, flags=re.M))
          PY

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Surge ${{ steps.v.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/surge-${{ steps.v.outputs.version }}.tgz
            dist/surge-${{ steps.v.outputs.version }}.zip
            dist/surge-${{ steps.v.outputs.version }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: surge-${{ steps.v.outputs.version }}
          path: dist/

  image:
    name: Docker image (GLPI ${{ matrix.glpi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - glpi: '11.0'
            suffix: glpi11
          - glpi: '12.0'
            suffix: glpi12
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=$(grep -oP "PLUGIN_SURGE_VERSION',\s*'\K[^']+" setup.php)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/glpi-surge
          T="$IMG:${{ steps.v.outputs.version }}-${{ matrix.suffix }},$IMG:${{ matrix.suffix }}"
          if [[ "${{ matrix.suffix }}" == "glpi11" ]]; then T="$T,$IMG:${{ steps.v.outputs.version }},$IMG:latest"; fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          build-args: GLPI_VERSION=${{ matrix.glpi }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
